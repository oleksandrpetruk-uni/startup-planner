name: Python Unit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Перевірка коду (Checkout)
      uses: actions/checkout@v4

    - name: Встановлення Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10" # Або інша версія, яку ви використовуєте

    - name: Встановлення залежностей
      run: |
        python -m pip install --upgrade pip
        pip install coverage

    - name: Запуск тестів та перевірка покриття
      run: |
        coverage run -m unittest test_startup_planner.py
        coverage report -m
