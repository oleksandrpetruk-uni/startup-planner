name: CI/CD Deploy Pipeline

on:
  push:
    branches: [ main ] # Пайплайн спрацьовує при пуші в main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pydantic
        # Якщо у вас залишилися тести з ЛР04, можна додати їх запуск сюди:
        # python -m unittest discover

  deploy:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Render Deploy Webhook
      # Запускається тільки якщо тести пройшли успішно
      run: |
        echo "Ініціалізація деплою на хмарну платформу..."
        # Замініть URL нижче на ваш реальний Webhook від Render (береться в налаштуваннях сервісу)
        # curl -X GET "${{ secrets.RENDER_DEPLOY_WEBHOOK_URL }}"
